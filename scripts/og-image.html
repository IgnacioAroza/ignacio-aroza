<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Geist+Mono:wght@400;500&family=Geist:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#0c1016;position:relative;font-family:"Geist",system-ui,sans-serif;color:#e6eaf2}
.glow{position:absolute;right:-140px;top:-200px;width:760px;height:760px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,207,122,.32) 0%,rgba(255,207,122,.10) 38%,transparent 66%)}
.glow2{position:absolute;left:-220px;bottom:-320px;width:700px;height:700px;border-radius:50%;
 background:radial-gradient(circle,rgba(124,183,255,.14) 0%,transparent 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#263044 1px,transparent 1px),linear-gradient(90deg,#263044 1px,transparent 1px);background-size:44px 44px;opacity:.22;
 -webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000 0%,transparent 70%)}
.content{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:1000px}
.kicker{font:500 22px "Geist Mono",monospace;color:#7cb7ff;letter-spacing:.02em}
h1{font:800 68px/1.02 "Bricolage Grotesque","Arial Black",sans-serif;letter-spacing:-.035em}
h1 span{color:#ffcf7a}
.stack{display:flex;gap:12px;margin-top:6px}
.chip{font:400 20px "Geist Mono",monospace;color:#b9c3d6;border:1px solid #263044;background:#131922;padding:8px 16px;border-radius:8px}
.url{position:absolute;right:60px;bottom:44px;font:500 24px "Geist Mono",monospace;color:#ffcf7a}
.url::before{content:"→ ";color:#7cb7ff}
</style></head><body>
<div class="glow"></div><div class="glow2"></div><div class="grid"></div>
<div class="content">
 <div class="kicker">&lt;desarrollador full-stack /&gt;</div>
 <h1>Resuelvo problemas reales<br>con software <span>a medida.</span></h1>
 <div class="stack"><span class="chip">TypeScript</span><span class="chip">Next.js</span><span class="chip">NestJS</span></div>
</div>
<div class="url">ignacioaroza.site</div>
</body></html>
